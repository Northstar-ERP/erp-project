services:
  # Django backend
  web:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: erp_django
    restart: unless-stopped
    env_file:
      - ../.env
    expose:
      - "8000"
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media
    networks:
      - erp_network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Nginx serves React and proxies Django
  nginx:
    image: nginx:alpine
    container_name: erp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - staticfiles:/usr/share/nginx/static:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - erp_network

volumes:
  staticfiles:
  mediafiles:

networks:
  erp_network:
    driver: bridge
